name: Repository CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Validate repository layout
      run: |
        test -d web
        test -d powershell
        test -d windows
        test -d android
        test -f web/index.html
        test -f web/src/styles.css
        test -f web/src/main.js
        test -f web/vite.config.js
        test -f web/package.json
        test -f powershell/native-widget.ps1
        test -f windows/BinaryBloomClock.Windows.csproj
        test -f android/app/build.gradle.kts

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24

    - name: Install web dependencies
      working-directory: web
      run: npm ci

    - name: Build web PWA
      working-directory: web
      run: npm run build

    - name: Validate build output
      run: |
        test -f web/dist/index.html
        test -f web/dist/manifest.webmanifest
        test -d web/dist/icons

    - name: Validate PowerShell syntax
      shell: pwsh
      run: |
        $errors = @()
        Get-ChildItem -Path powershell -Filter *.ps1 | ForEach-Object {
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
          if ($parseErrors) {
            $errors += $parseErrors
          }
        }

        if ($errors.Count -gt 0) {
          $errors | ForEach-Object { Write-Host $_ }
          throw "PowerShell parse errors found."
        }

  windows-build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    - name: Build Windows wrapper
      run: dotnet build windows/BinaryBloomClock.Windows.csproj --configuration Release --nologo
